name: Deploy site to GitHub Pages

# Publishes https://christopher-icalla.github.io/tugma/ as plain static files:
#   /                landing page (site/)
#   /images/         screenshots (docs/images/)
#   /verifier/web/   the browser verifier, with the modules it imports in /verifier/src/
# No Jekyll build: the verifier must be served exactly as committed.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble the static site
        run: |
          mkdir -p _site/verifier _site/images
          cp -r site/. _site/
          cp -r docs/images/. _site/images/
          cp -r verifier/web verifier/src _site/verifier/
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
