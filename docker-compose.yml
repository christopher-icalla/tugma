# Local stack: PostgreSQL + TUGMA API. Run the frontend with `yarn start` in frontend/.
#   cp backend/.env.example backend/.env   # then edit secrets
#   POSTGRES_PASSWORD=$(openssl rand -hex 16) docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tugma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tugma
    # Local only: never publish Postgres on all interfaces.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tugma"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://tugma:${POSTGRES_PASSWORD}@db:5432/tugma?schema=public
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
